name: Generate Pacman

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman
        run: |
          mkdir -p dist

          npx pacman-contribution-graph \
            --platform github \
            --username SouzaJ10 \
            --game pacman \
            --gameTheme github \
            --output dist/pacman-contribution-graph.svg

          npx pacman-contribution-graph \
            --platform github \
            --username SouzaJ10 \
            --game pacman \
            --gameTheme github-dark \
            --output dist/pacman-contribution-graph-dark.svg

      - name: Push Pacman to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
